<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body { 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0b1d3a 0%, #1a365d 50%, #0d253f 100%);
      background-attachment: fixed;
      color: #ffffff;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    /* Ambient background depth lights */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      z-index: -1;
      pointer-events: none;
    }

    body::before {
      width: 400px;
      height: 400px;
      background: rgba(0, 198, 255, 0.3);
      top: 5%;
      left: 10%;
    }

    body::after {
      width: 450px;
      height: 450px;
      background: rgba(0, 114, 255, 0.25);
      bottom: 5%;
      right: 10%;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    .logo {
      flex-shrink: 0;
      width: 80px;
      height: 80px;
      object-fit: contain;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 8px 24px rgba(2,12,24,0.3), inset 0 1px 0 rgba(255,255,255,0.4);
      padding: 8px;
    }

    .page-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .page-header h2 { 
      font-size: 1.8em;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      text-shadow: 0 2px 12px rgba(0,0,0,0.25);
      margin: 0 0 4px;
    }

    .page-header p { 
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.85rem;
      line-height: 1.2;
    }

    /* Glass Panels */
    .glass-section {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25), 
                  inset 0 1px 1px rgba(255, 255, 255, 0.3);
      border-radius: 28px;
      padding: 24px 30px;
      margin-bottom: 25px;
    }

    /* Animated Glass Spinner & Status Bar */
    .spinner-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 35px 20px;
      gap: 16px;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.12);
      border-top: 4px solid #00c6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      box-shadow: 0 0 15px rgba(0, 198, 255, 0.4);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .status-text {
      font-size: 0.9rem;
      font-weight: 600;
      color: #00c6ff;
      letter-spacing: 0.3px;
      text-align: center;
      transition: all 0.3s ease;
    }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .filter-title {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: rgba(255, 255, 255, 0.7);
    }

    .filter-options {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: nowrap;
    }

    .checkbox-pill {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 10px;
      border-radius: 50px;
      cursor: pointer;
      user-select: none;
      transition: all 0.25s ease;
      font-size: 0.8rem;
      font-weight: 500;
      white-space: nowrap;
    }

    .checkbox-pill input[type="checkbox"] {
      width: 14px;
      height: 14px;
      accent-color: #00c6ff;
      cursor: pointer;
    }

    /* AI Query Section Styles */
    .query-section {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .query-input-group {
      display: flex;
      gap: 10px;
    }

    .query-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      padding: 10px 16px;
      color: #ffffff;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: all 0.25s ease;
    }

    .query-input::placeholder {
      color: rgba(255, 255, 255, 0.45);
    }

    .query-input:focus {
      border-color: #00c6ff;
      background: rgba(0, 0, 0, 0.35);
      box-shadow: 0 0 10px rgba(0, 198, 255, 0.3);
    }

    .query-btn {
      background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
      border: none;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
      box-shadow: 0 4px 15px rgba(0, 198, 255, 0.3);
    }

    .query-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 198, 255, 0.5);
    }

    .query-btn:active {
      transform: translateY(0);
    }

    /* Action Bar for Copy Buttons */
    .action-bar {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    .action-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(0, 198, 255, 0.15);
      border: 1px solid rgba(0, 198, 255, 0.4);
      color: #00c6ff;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      user-select: none;
    }

    .action-btn:hover {
      background: rgba(0, 198, 255, 0.3);
      border-color: rgba(0, 198, 255, 0.7);
      box-shadow: 0 4px 12px rgba(0, 198, 255, 0.2);
      transform: translateY(-1px);
    }

    .action-btn:active {
      transform: translateY(0);
    }

    .action-btn.copied {
      background: rgba(0, 230, 118, 0.25);
      border-color: rgba(0, 230, 118, 0.6);
      color: #00e676;
    }

    /* Member List Container */
    .member-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Member Card Row */
    .member-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 18px 24px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.25s ease;
    }

    .member-row:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(0, 198, 255, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    /* Left Side Info */
    .member-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }

    .member-header-line {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .member-num-badge {
      background: rgba(0, 198, 255, 0.25);
      border: 1px solid rgba(0, 198, 255, 0.5);
      color: #00c6ff;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .member-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .member-contact {
      display: flex;
      gap: 16px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.75);
      margin-top: 2px;
      flex-wrap: wrap;
    }

    .member-contact span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    /* Right Side Status Badges */
    .member-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      margin-left: 15px;
    }

    .badge-pill {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 12px;
      display: inline-block;
      line-height: 1.2;
      white-space: nowrap;
    }

    .pill-membership {
      background-color: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .pill-paid {
      background-color: rgba(0, 230, 118, 0.2);
      color: #00e676;
      border: 1px solid rgba(0, 230, 118, 0.4);
    }

    .pill-unpaid {
      background-color: rgba(255, 82, 82, 0.2);
      color: #ff5252;
      border: 1px solid rgba(255, 82, 82, 0.4);
    }

    .pill-active {
      background-color: rgba(0, 198, 255, 0.2);
      color: #00c6ff;
      border: 1px solid rgba(0, 198, 255, 0.4);
    }

    .pill-inactive {
      background-color: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Color-coded Membership Pills */
    .pill-full {
      background-color: rgba(0, 230, 118, 0.2);
      color: #00e676;
      border: 1px solid rgba(0, 230, 118, 0.4);
    }

    .pill-affiliate {
      background-color: rgba(0, 198, 255, 0.2);
      color: #00c6ff;
      border: 1px solid rgba(0, 198, 255, 0.4);
    }

    .pill-expired {
      background-color: rgba(255, 171, 0, 0.2);
      color: #ffab00;
      border: 1px solid rgba(255, 171, 0, 0.4);
    }

    .pill-terminated {
      background-color: rgba(255, 82, 82, 0.2);
      color: #ff5252;
      border: 1px solid rgba(255, 82, 82, 0.4);
    }

    .pill-admin {
      background-color: rgba(255, 255, 255, 0.15);
      color: #b0bec5;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.95rem;
    }

    .ai-response-box {
      white-space: pre-wrap;
      font-family: inherit;
      line-height: 1.6;
      font-size: 0.95rem;
      color: #ffffff;
    }

    @media (max-width: 640px) {
      .member-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .member-right {
        justify-content: flex-start;
      }

      .member-contact {
        flex-direction: column;
        gap: 2px;
      }

      .page-header {
        flex-direction: column;
        text-align: center;
      }

      .query-input-group {
        flex-direction: column;
      }

      .action-bar {
        flex-direction: column;
      }
    }

    .checkbox-pill.active {
      background: rgba(0, 198, 255, 0.25);
      border-color: rgba(0, 198, 255, 0.6);
      color: #00c6ff;
    }

    .checkbox-pill input[type="radio"] {
      width: 14px;
      height: 14px;
      accent-color: #00c6ff;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="page-header">
      <img class="logo" src="https://lh3.googleusercontent.com/d/1jy49r9b2qUZbDY31PIhJPE2QmFngPRNg=w200?authuser=0" alt="SMMC Logo">
      <div>
        <h2>SMMC Members List</h2>
        <p>Select a member from the directory below to view or edit full details.</p>
      </div>
    </div>

    <!-- Filter & AI Query Section -->
    <div class="glass-section">
      <div class="filter-bar">
        <div class="filter-title">Filter View:</div>
          <div class="filter-options">
            <label class="checkbox-pill" id="pill-full">
              <input type="radio" name="memberFilter" value="full" onchange="handleFilterChange(this)">
              <span>Full Directory</span>
            </label>

            <label class="checkbox-pill" id="pill-committee">
              <input type="radio" name="memberFilter" value="committee" onchange="handleFilterChange(this)">
              <span>Committee</span>
            </label>

            <label class="checkbox-pill" id="pill-paid">
              <input type="radio" name="memberFilter" value="paid" onchange="handleFilterChange(this)">
              <span>Paid Members</span>
            </label>
          </div>
      </div>

      <!-- AI Query Input Box -->
      <div class="query-section">
        <div class="filter-title">Create Query:</div>
        <div class="query-input-group">
          <input type="text" id="userQueryInput" class="query-input" placeholder="e.g., list of DF65 sailors" onkeydown="if(event.key === 'Enter') submitAiQuery()">
          <button type="button" class="query-btn" onclick="submitAiQuery()">Run Query</button>
        </div>
      </div>

      <!-- Action Bar -->
      <div class="action-bar">
        <button type="button" class="action-btn" id="btn-copy-phones" onclick="copyPhoneList(event)">
          📞 Copy Phone List
        </button>
        <button type="button" class="action-btn" id="btn-copy-emails" onclick="copyEmailList(event)">
          ✉️ Copy Email List
        </button>
      </div>
    </div>

    <!-- Member List / AI Output -->
    <div id="memberList" class="member-list"></div>
  </div>

<script>
    let masterMembersList = []; // Preserves full database copy
    let allMembers = [];

    // Initialize Page on Load
    window.addEventListener('DOMContentLoaded', function() {
      // Read the filterType variable passed from Google Apps Script
      let initialType = "<?= filterType ?>".toLowerCase();
      if (!['full', 'committee', 'paid'].includes(initialType)) {
        initialType = 'full';
      }

      setCheckboxes(initialType);

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(data) {
            if (data && Array.isArray(data)) {
              masterMembersList = data;
              allMembers = [...masterMembersList];
            }
            renderList(initialType);
          })
          .withFailureHandler(function(err) {
            console.error("Error fetching members:", err);
            renderList(initialType);
          })
          .getMembers("full");
      } else {
        renderList(initialType);
      }
    });

    function getMembershipPillClass(type) {
      const t = String(type || '').toLowerCase().trim();
      if (t.includes('full')) return 'pill-full';
      if (t.includes('affiliate')) return 'pill-affiliate';
      if (t.includes('expired')) return 'pill-expired';
      if (t.includes('terminated')) return 'pill-terminated';
      if (t.includes('admin')) return 'pill-admin';
      return 'pill-membership';
    }

    // Filter Change Handler
    function handleFilterChange(selectedRadio) {
      if (masterMembersList.length > 0) {
        allMembers = [...masterMembersList];
      }

      const inputEl = document.getElementById('userQueryInput');
      if (inputEl) inputEl.value = '';

      updatePillStyles();
      renderList(selectedRadio.value);
    }

    function getCurrentFilteredMembers() {
      const filter = getFilter();
      if (!Array.isArray(allMembers)) return [];

      return allMembers.filter(m => {
        if (!m) return false;

        const membership = String(m.membership || m.membershipType || m.membershiptype || m.Membership || '').toLowerCase();
        const isCommittee = m.committee === true || 
                            m.Committee === true || 
                            String(m.committee || m.Committee).toUpperCase() === 'TRUE' || 
                            membership.includes('committee');

        const isPaid = m.paid === true || 
                      m.Paid === true || 
                      String(m.paid || m.Paid).toUpperCase() === 'TRUE' || 
                      String(m.paid || m.Paid).toLowerCase() === 'yes';

        if (filter === 'committee') return isCommittee;
        if (filter === 'paid') return isPaid;
        return true;
      });
    }

    // AI Agent Query Handler
    let statusInterval = null;

    function submitAiQuery() {
      const inputEl = document.getElementById('userQueryInput');
      const btnEl = document.querySelector('.query-btn');
      const userQuery = inputEl ? inputEl.value.trim() : '';

      if (!userQuery) return;

      clearCheckboxes();
      if (inputEl) inputEl.disabled = true;
      if (btnEl) {
        btnEl.disabled = true;
        btnEl.style.opacity = '0.6';
      }

      const container = document.getElementById('memberList');
      container.innerHTML = `
        <div class="glass-section spinner-container">
          <div class="spinner"></div>
          <div class="status-text" id="aiStatusStep">Analyzing query...</div>
        </div>
      `;

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(jsonResponse) {
            cleanupUI();
            try {
              let membersArray = typeof jsonResponse === 'string' ? JSON.parse(jsonResponse) : jsonResponse;
              
              // If AI returns empty, run local search fallback on masterMembersList
              if (!Array.isArray(membersArray) || membersArray.length === 0) {
                membersArray = filterMembersLocally(userQuery);
              }
              renderAiResults(membersArray, userQuery);
            } catch (e) {
              console.error("JSON parse error:", e);
              const fallback = filterMembersLocally(userQuery);
              renderAiResults(fallback, userQuery);
            }
          })
          .withFailureHandler(function(err) {
            cleanupUI();
            console.error("AI Agent Error:", err);
            // Fallback to local filter on failure
            const fallback = filterMembersLocally(userQuery);
            renderAiResults(fallback, userQuery);
          })
          .queryMemberContactAgent(userQuery);
      } else {
        cleanupUI();
        const fallback = filterMembersLocally(userQuery);
        renderAiResults(fallback, userQuery);
      }

      function cleanupUI() {
        if (inputEl) inputEl.disabled = false;
        if (btnEl) {
          btnEl.disabled = false;
          btnEl.style.opacity = '1';
        }
      }
    }

    // Local search function to handle noise words and class aliases
    function filterMembersLocally(queryText) {
      if (!masterMembersList || masterMembersList.length === 0) return [];

      // Normalize terms: remove generic words like 'sailors', 'members', 'list'
      const cleanQuery = queryText
        .toLowerCase()
        .replace(/\b(sailors?|members?|list|of|who|have|sail|boats?)\b/g, '')
        .trim();

      // Map common class aliases
      let searchTerms = [cleanQuery];
      if (cleanQuery.includes('df65') || cleanQuery.includes('df 65')) {
        searchTerms.push('df65', 'df 65', 'dragonforce 65', 'dragon force 65');
      }

      return masterMembersList.filter(m => {
        const classes = Array.isArray(m.classesSailed) 
          ? m.classesSailed.join(' ').toLowerCase() 
          : String(m.classesSailed || m.classes || m.boat || '').toLowerCase();
        
        const name = String(m.name || m.Name || '').toLowerCase();

        return searchTerms.some(term => term && (classes.includes(term) || name.includes(term)));
      });
    }

    function renderAiResults(members, queryText) {
      const container = document.getElementById('memberList');

      if (!Array.isArray(members) || members.length === 0) {
        container.innerHTML = `
          <div class="glass-section empty-state">
            No members matched the query "${escapeHtml(queryText)}".
          </div>
        `;
        return;
      }

      allMembers = members;

      const cardsHtml = members.map(m => {
        const isPaid = m.paid === true || m.Paid === true || String(m.paid || m.Paid).toUpperCase() === 'TRUE' || String(m.paid || m.Paid).toLowerCase() === 'yes';
        const isActive = m.active === true || m.Active === true || String(m.active || m.Active).toUpperCase() === 'TRUE' || String(m.active || m.Active).toLowerCase() === 'yes';
        const rawEmail = m.email || m.Email || '';
        const membershipStr = m.membership || m.membershipType || m.membershiptype || m.Membership || 'Full';
        const membershipClass = getMembershipPillClass(membershipStr);
        
        const classesStr = Array.isArray(m.classesSailed) 
          ? m.classesSailed.join(', ') 
          : (m.classesSailed || '');

        return `
          <div class="member-row" data-email="${escapeHtml(rawEmail)}">
            <div class="member-left">
              <div class="member-header-line">
                <span class="member-num-badge">#${escapeHtml(m.id || m.memberId || '')}</span>
                <span class="member-name">${escapeHtml(m.name || m.Name)}</span>
              </div>
              <div class="member-contact">
                <span>📞 ${escapeHtml(m.phone || m.Phone || 'N/A')}</span>
                <span>✉️ ${escapeHtml(rawEmail || 'N/A')}</span>
                ${classesStr ? `<span style="opacity: 0.8; font-size: 0.8rem;">${escapeHtml(classesStr)}</span>` : ''}
              </div>
            </div>

            <div class="member-right">
              <span class="badge-pill ${membershipClass}">${escapeHtml(membershipStr)}</span>
              <span class="badge-pill ${isPaid ? 'pill-paid' : 'pill-unpaid'}">
                ${isPaid ? 'Paid' : 'Unpaid'}
              </span>
              <span class="badge-pill ${isActive ? 'pill-active' : 'pill-inactive'}">
                ${isActive ? 'Active' : 'Inactive'}
              </span>
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = `
        <div class="filter-title" style="margin-bottom: 12px; color: #00c6ff;">
          AI Agent Results for "${escapeHtml(queryText)}" (${members.length} members)
        </div>
        ${cardsHtml}
      `;

      container.onclick = function(e) {
        const row = e.target.closest('.member-row');
        if (row) {
          const email = row.getAttribute('data-email');
          selectMember(email);
        }
      };
    }

    function clearCheckboxes() {
      const inputs = document.querySelectorAll('input[name="memberFilter"]');
      inputs.forEach(input => input.checked = false);
      updatePillStyles();
    }

    function setCheckboxes(filterValue) {
      const inputs = document.querySelectorAll('input[name="memberFilter"]');
      inputs.forEach(input => {
        input.checked = (input.value === filterValue);
      });
      updatePillStyles();
    }

    function updatePillStyles() {
      const inputs = document.querySelectorAll('input[name="memberFilter"]');
      inputs.forEach(input => {
        const pill = document.getElementById(`pill-${input.value}`);
        if (pill) {
          if (input.checked) {
            pill.classList.add('active');
          } else {
            pill.classList.remove('active');
          }
        }
      });
    }

    function getFilter() {
      const active = document.querySelector('input[name="memberFilter"]:checked');
      return active ? active.value : 'full';
    }

    // Render Member List
    function renderList(filter) {
      filter = filter || getFilter();
      const container = document.getElementById('memberList');
      
      const filteredMembers = getCurrentFilteredMembers();

      if (filteredMembers.length === 0) {
        container.innerHTML = '<div class="glass-section empty-state">No members match the selected filter.</div>';
        return;
      }

      container.innerHTML = filteredMembers.map(m => {
        const isPaid = m.paid === true || m.Paid === true || String(m.paid || m.Paid).toUpperCase() === 'TRUE' || String(m.paid || m.Paid).toLowerCase() === 'yes';
        const isActive = m.active === true || m.Active === true || String(m.active || m.Active).toUpperCase() === 'TRUE' || String(m.active || m.Active).toLowerCase() === 'yes';
        const rawEmail = m.email || m.Email || '';
        const membershipStr = m.membership || m.membershipType || m.membershiptype || m.Membership || 'Member';
        const membershipClass = getMembershipPillClass(membershipStr);

        return `
          <div class="member-row" data-email="${escapeHtml(rawEmail)}">
            <div class="member-left">
              <div class="member-header-line">
                <span class="member-num-badge">#${escapeHtml(m.id || m.memberId || '')}</span>
                <span class="member-name">${escapeHtml(m.name || m.Name)}</span>
              </div>
              <div class="member-contact">
                <span>📞 ${escapeHtml(m.phone || m.Phone || 'N/A')}</span>
                <span>✉️ ${escapeHtml(rawEmail || 'N/A')}</span>
              </div>
            </div>

            <div class="member-right">
              <span class="badge-pill ${membershipClass}">${escapeHtml(membershipStr)}</span>
              <span class="badge-pill ${isPaid ? 'pill-paid' : 'pill-unpaid'}">
                ${isPaid ? 'Paid' : 'Unpaid'}
              </span>
              <span class="badge-pill ${isActive ? 'pill-active' : 'pill-inactive'}">
                ${isActive ? 'Active' : 'Inactive'}
              </span>
            </div>
          </div>
        `;
      }).join('');

      container.onclick = function(e) {
        const row = e.target.closest('.member-row');
        if (row) {
          const email = row.getAttribute('data-email');
          selectMember(email);
        }
      };
    }

    function selectMember(memberEmail) {
      if (!memberEmail || memberEmail.toLowerCase() === 'n/a' || memberEmail.trim() === '') {
        alert('Selected member does not have a valid email address.');
        return;
      }

      const currentFilter = getFilter();

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withFailureHandler(function(err) {
            alert("Error opening member: " + (err.message || err));
          })
          .openMemberDialog(memberEmail, currentFilter);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function copyPhoneList(event) {
      if (event) event.preventDefault();

      try {
        const members = getCurrentFilteredMembers();
        const phones = members
          .map(m => (m.phone || m.Phone || m.mobile || m.Mobile || '').toString().trim())
          .filter(p => p !== '' && p.toLowerCase() !== 'n/a');

        if (phones.length === 0) {
          alert('No valid phone numbers found in the current selection.');
          return;
        }

        copyToClipboard(phones.join('\n'), 'btn-copy-phones', '📞 Copy Phone List');
      } catch (err) {
        console.error('Error in copyPhoneList:', err);
        alert('An error occurred while compiling the phone list: ' + err.message);
      }
    }

    function copyEmailList(event) {
      if (event) event.preventDefault();

      try {
        const members = getCurrentFilteredMembers();
        const emails = members
          .map(m => (m.email || m.Email || m.mail || '').toString().trim())
          .filter(e => e !== '' && e.toLowerCase() !== 'n/a');

        if (emails.length === 0) {
          alert('No valid email addresses found in the current selection.');
          return;
        }

        copyToClipboard(emails.join('\n'), 'btn-copy-emails', '✉️ Copy Email List');
      } catch (err) {
        console.error('Error in copyEmailList:', err);
        alert('An error occurred while compiling the email list: ' + err.message);
      }
    }

    function copyToClipboard(text, buttonId, originalHtml) {
      const btn = document.getElementById(buttonId);
      let copySuccessful = false;

      const textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.style.position = 'fixed';
      textArea.style.left = '-999999px';
      textArea.style.top = '-999999px';
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();

      try {
        copySuccessful = document.execCommand('copy');
      } catch (err) {
        console.warn('execCommand failed:', err);
      }
      document.body.removeChild(textArea);

      if (!copySuccessful && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => showSuccessUI(btn, originalHtml))
          .catch(() => showFallbackModal(text));
        return;
      }

      if (copySuccessful) {
        showSuccessUI(btn, originalHtml);
      } else {
        showFallbackModal(text);
      }
    }

    function showSuccessUI(btn, originalHtml) {
      if (!btn) return;
      btn.classList.add('copied');
      btn.innerHTML = `✓ Copied!`;
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = originalHtml;
      }, 2000);
    }

    function showFallbackModal(text) {
      const existingModal = document.getElementById('copyFallbackModal');
      if (existingModal) existingModal.remove();

      const modal = document.createElement('div');
      modal.id = 'copyFallbackModal';
      modal.style.cssText = `
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
        display: flex; align-items: center; justify-content: center;
        z-index: 99999; padding: 20px;
      `;

      modal.innerHTML = `
        <div style="
          background: rgba(26, 54, 93, 0.95); border: 1px solid rgba(0, 198, 255, 0.4);
          padding: 24px; border-radius: 20px; width: 100%; max-width: 450px;
          box-shadow: 0 20px 40px rgba(0,0,0,0.5); color: #fff;
        ">
          <h3 style="margin-bottom: 8px; font-size: 1.1rem; color: #00c6ff;">Copy List</h3>
          <p style="font-size: 0.85rem; color: rgba(255,255,255,0.8); margin-bottom: 12px;">
            Browser restrictions prevented auto-copy. Press <b>Ctrl+C</b> (or <b>Cmd+C</b>) to copy:
          </p>
          <textarea id="fallbackTextarea" style="
            width: 100%; height: 180px; background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 10px;
            color: #fff; padding: 10px; font-family: monospace; font-size: 0.85rem;
          " readonly>${escapeHtml(text)}</textarea>
          <button onclick="document.getElementById('copyFallbackModal').remove()" style="
            margin-top: 14px; width: 100%; padding: 10px; background: rgba(0,198,255,0.2);
            border: 1px solid rgba(0,198,255,0.5); color: #00c6ff; border-radius: 10px;
            font-weight: 600; cursor: pointer;
          ">Close</button>
        </div>
      `;

      document.body.appendChild(modal);
      const ta = document.getElementById('fallbackTextarea');
      ta.focus();
      ta.select();
    }
  </script>
</body>
</html>
