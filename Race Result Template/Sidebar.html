<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    Heading {
      font-family: Arial, sans-serif;
      font-size: 8px;
      padding: 10px;
      margin: 0; 
      background-color: #e3f2fd;
      border-color: #2196F3;     
    }
    body {
      font-family: Arial, sans-serif;
      padding: 10px;
      margin: 0;
    }
    
    #loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }
    
    .file-item {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 10px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    .file-item:hover {
      background-color: #f5f5f5;
    }
    
    .file-item.selected {
      background-color: #e3f2fd;
      border-color: #2196F3;
    }
    
    .file-thumbnail {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    
    .file-name {
      font-size: 12px;
      word-break: break-word;
      color: #333;
    }
    
    #processBtn {
      width: 100%;
      padding: 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
    }
    
    #processBtn:hover {
      background-color: #45a049;
    }
    
    #processBtn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    
    #status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
      display: none;
    }
    
    #status.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    #status.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    #status.processing {
      background-color: #fff3cd;
      color: #856404;
      border: 1px solid #ffeaa7;
    }
    
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #3498db;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 10px auto;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <div class="Heading">
    <h3>
      Race Results - Upload folder:
    </h3>
  </div>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Loading images...</p>
  </div>
  
  <div id="fileList" style="display: none;"></div>
  
  <button id="processBtn" disabled>Load Selected Race Results</button>
  
  <div id="status"></div>

  <script>
    let selectedFileId = null;
    
    // Load files on page load
    google.script.run
      .withSuccessHandler(displayFiles)
      .withFailureHandler(showError)
      .getImageFiles();
    
    function displayFiles(files) {
      const loading = document.getElementById('loading');
      const fileList = document.getElementById('fileList');
      
      loading.style.display = 'none';
      fileList.style.display = 'block';
      
      if (files.length === 0) {
        fileList.innerHTML = '<p style="color: #666;">No images found in folder.</p>';
        return;
      }
      
      fileList.innerHTML = '';
      
      files.forEach(file => {
        const fileItem = document.createElement('div');
        fileItem.className = 'file-item';
        fileItem.onclick = () => selectFile(file.id, fileItem);
        
        fileItem.innerHTML = `
          <img src="${file.thumbnailUrl}" class="file-thumbnail" alt="${file.name}">
          <div class="file-name">${file.name}</div>
        `;
        
        fileList.appendChild(fileItem);
      });
    }
    
    function selectFile(fileId, element) {
      // Remove previous selection
      document.querySelectorAll('.file-item').forEach(item => {
        item.classList.remove('selected');
      });
      
      // Select current file
      element.classList.add('selected');
      selectedFileId = fileId;
      document.getElementById('processBtn').disabled = false;
    }
    
    document.getElementById('processBtn').onclick = function() {
      if (!selectedFileId) return;
      
      const statusDiv = document.getElementById('status');
      statusDiv.style.display = 'block';
      statusDiv.className = 'processing';
      statusDiv.innerHTML = '<div class="spinner"></div><p>Processing image and extracting race data...</p>';
      
      document.getElementById('processBtn').disabled = true;
      
      // Process the image and get JSON data
      google.script.run
        .withSuccessHandler(function(jsonData) {
          // Now populate the sheet with the data
          google.script.run
            .withSuccessHandler(function(result) {
              statusDiv.className = 'success';
              statusDiv.innerHTML = result.message;
              document.getElementById('processBtn').disabled = false;
            })
            .withFailureHandler(function(error) {
              statusDiv.className = 'error';
              statusDiv.innerHTML = 'Error: ' + error.message;
              document.getElementById('processBtn').disabled = false;
            })
            .populateSheet(jsonData, selectedFileId);
        })
        .withFailureHandler(function(error) {
          statusDiv.className = 'error';
          statusDiv.innerHTML = 'Error processing image: ' + error.message;
          document.getElementById('processBtn').disabled = false;
        })
        .processImageFile(selectedFileId);
    };
    
    function showError(error) {
      const loading = document.getElementById('loading');
      loading.innerHTML = '<p style="color: red;">Error: ' + error.message + '</p>';
    }
  </script>
</body>
</head>
</html>
